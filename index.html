<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angkatan 98</title>
<meta name="description" content="Game naratif sudut pandang orang pertama tentang gerakan mahasiswa Indonesia, 1996–2006.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: panggung adegan 16:9 di atas, naskah kertas di bawahnya; satu cetakan cukil kayu di atas meja kerja gelap */
:root {
  --desk: #221f1b;
  --on-desk: #d8ceb6;
  --on-desk-soft: #9c927f;
  --paper: #e8e0cb;
  --paper-2: #d6ccb2;
  --sheet: #f2ecdc;
  --ink: #1c1916;
  --ink-soft: #5a5247;
  --red: #b0281d;
  --red-hi: #e2685c;
  --blue: #1f3f78;
  --f-display: "Saira Stencil One", Impact, "Arial Narrow", sans-serif;
  --f-body: "Courier Prime", "Courier New", Courier, monospace;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--desk);
  color: var(--on-desk);
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
.app { max-width: 1040px; margin: 0 auto; display: grid; gap: 12px; }
.hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 18px; }
.hud-title { font-family: var(--f-display); font-size: 1.2rem; letter-spacing: .04em; color: var(--paper); }
.hud-title small { font-family: var(--f-body); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--on-desk-soft); margin-left: 8px; }
.hud-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.hud-stats b { color: var(--paper); }
.hud-stats .warn, .hud-stats .warn b { color: var(--red-hi); }
.hud-stats .bar { display: inline-flex; align-items: center; gap: 6px; }
.hud-stats .bar i { display: inline-block; width: 56px; height: 8px; border: 1px solid var(--on-desk-soft); }
.hud-stats .bar b { display: block; height: 100%; background: var(--paper); }
.hud-stats .bar.warn b { background: var(--red-hi); }
.hud-suara { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--paper); background: transparent; border: 1px solid var(--on-desk-soft); padding: 0 6px; cursor: pointer; }
.hud-suara:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
.rank { border: 2px solid var(--red-hi); color: var(--red-hi); padding: 0 6px; font-family: var(--f-display); font-size: .9rem; letter-spacing: .05em; }
.stage { position: relative; width: min(100%, calc((100vh - 290px) * 16 / 9)); min-width: min(100%, 520px); max-width: 100%; margin: 0 auto; aspect-ratio: 16 / 9; background: var(--paper); box-shadow: 0 22px 44px -26px #000; overflow: hidden; }
.kam { width: 100%; height: 100%; will-change: transform; }
.kam.dorong { animation: dorong 26s cubic-bezier(.2, .6, .3, 1) both; }
@keyframes dorong { from { transform: scale(1); } to { transform: scale(1.035); } }
.kam > svg { display: block; width: 100%; height: 100%; transition: transform 1.1s cubic-bezier(.3, .7, .2, 1); }
/* tokoh bernapas patah-patah seperti animasi cukil, berganti pose dua kali per tarikan; filter kasar hanya dihitung ulang saat pose berganti */
.stage .napas { animation: napas 4.4s steps(1, end) infinite var(--fase, 0s); }
@keyframes napas { 0% { transform: none; } 50% { transform: translateY(-2px); } }
.stage .napas .mata { animation: kedip 5.7s steps(1, end) infinite var(--fase, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes kedip { 0% { transform: none; } 96% { transform: scaleY(.15); } 98% { transform: none; } }
.keterangan { position: absolute; left: 3%; bottom: 5%; margin: 0; max-width: 90%; box-sizing: content-box; padding: .25em .6em; overflow: hidden; white-space: nowrap; background: var(--ink); color: var(--paper); font-weight: 700; font-size: clamp(.78rem, 1.9vw, 1.05rem); line-height: 1.4; opacity: 0; pointer-events: none; }
.keterangan.ketik { animation: ketik calc(var(--n) * 42ms) steps(var(--n), end) .45s both, pudar .8s calc(var(--n) * 42ms + 3.4s) forwards; }
@keyframes ketik { from { width: 0; opacity: 1; } to { width: calc(var(--n) * 1ch); opacity: 1; } }
@keyframes pudar { to { opacity: 0; } }
/* naskah ditekan ke kertas satu per satu */
.mengungkap .ungkap { animation: tinta .55s var(--tunda, 0s) cubic-bezier(.2, .7, .3, 1) both; }
@keyframes tinta { from { opacity: 0; visibility: hidden; filter: blur(1.5px); } to { opacity: 1; visibility: visible; filter: none; } }
/* pilihan dibaca sebagai tindakan dalam cerita; labelnya hanya untuk pembaca layar */
.pick .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pick::before { content: "— "; }
.hot { cursor: pointer; outline: none; }
.hot:hover, .hot:focus-visible { filter: drop-shadow(0 0 2px var(--red)) drop-shadow(0 0 8px var(--red)); }
.titik { cursor: crosshair; outline: none; }
.titik:hover, .titik:focus-visible { filter: drop-shadow(0 0 2px var(--paper)) drop-shadow(0 0 8px var(--paper)); }
.kam > svg:has(.titik) { touch-action: none; }
.neon { animation: flick 5s infinite steps(1); }
@keyframes flick { 0%, 100% { opacity: 1; } 46% { opacity: .35; } 47% { opacity: 1; } 71% { opacity: .55; } 72% { opacity: 1; } }
.blink i { position: absolute; left: 0; right: 0; height: 51%; background: #0c0a09; transform: scaleY(0); transition: transform .42s cubic-bezier(.2, .7, .3, 1); pointer-events: none; }
.stage.shut .blink i { transition: transform .22s ease-in; }
.blink i:first-child { top: 0; transform-origin: top; }
.blink i:last-child { bottom: 0; transform-origin: bottom; }
.stage.shut .blink i { transform: scaleY(1); }
.panel { background: var(--paper); color: var(--ink); padding: clamp(16px, 3vw, 28px); display: grid; gap: 14px; min-width: 0; }
.panel:focus { outline: none; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin: 0; padding-bottom: 6px; border-bottom: 4px double var(--ink); font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.meta span:last-child { color: var(--ink-soft); }
.prose { display: grid; gap: 10px; max-width: 68ch; }
.panel p { margin: 0; }
.label { margin: 0; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.obs { background: var(--paper-2); padding: 12px 14px; display: grid; gap: 8px; max-width: 68ch; }
.obs:focus, .kabar:focus, .mg:focus { outline: none; }
.waktu-bar, .meter { height: 8px; background: var(--sheet); border: 2px solid var(--ink); }
.waktu-bar i, .meter i { display: block; height: 100%; background: var(--red); }
.waktu-bar i { width: var(--mulai); animation: susut linear forwards; }
@keyframes susut { from { width: var(--mulai); } to { width: 0; } }
@media (prefers-reduced-motion: reduce) { .waktu-bar i { animation-timing-function: steps(10); } }
.kalimat { font-weight: 700; min-height: 1.6em; }
.marah { display: grid; gap: 4px; margin: 6px 0; }
.kabar { display: grid; gap: 8px; max-width: 68ch; }
.kb { border-left: 3px solid var(--ink); padding: 2px 0 2px 12px; display: grid; gap: 2px; }
.kb p { font-style: italic; }
.cek { font-style: normal !important; font-weight: 700; font-size: .85rem; }
.say { font-style: italic; max-width: 68ch; }
/* suara batin protagonis: lebih redup dari narasi, seperti pikiran yang lewat */
.batin { font-style: italic; color: var(--ink-soft); max-width: 68ch; padding-left: 12px; border-left: 2px dotted var(--ink-soft); }
.jejak { display: grid; gap: 6px; max-width: 68ch; }
.jejak p:not(.label) { font-style: italic; }
.koleksi ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .86rem; }
.koleksi .belum { color: var(--ink-soft); }
/* percakapan: ucapan tokoh rata kiri seperti naskah, ucapanmu ditandai garis merah di tepi */
.dlg { display: grid; gap: 8px; max-width: 68ch; }
.dlg:focus { outline: none; }
.dlg .jawab { margin-left: 1.2em; padding-left: 10px; border-left: 3px solid var(--red); font-weight: 700; }
.dlg .choices { margin-top: 4px; }
.look { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { font: inherit; font-size: .86rem; color: var(--ink); background: transparent; border: 1.5px solid var(--ink); padding: 3px 10px; cursor: pointer; text-align: left; }
.chip.seen { border-style: dashed; color: var(--ink-soft); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-style: solid; }
.chip:hover { background: var(--ink); color: var(--paper); }
.chip:disabled { opacity: .45; cursor: not-allowed; background: transparent; color: var(--ink); }
.chip small { color: inherit; opacity: .8; }
.ask { display: grid; gap: 10px; }
.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.choice { width: 100%; display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 2px solid var(--ink); padding: 10px 12px; cursor: pointer; }
.choice:hover, .choice[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.choice:hover small.bad, .choice[aria-pressed="true"] small.bad { color: #f08a7e; }
.choice:disabled { opacity: .5; cursor: not-allowed; background: transparent; color: var(--ink); }
.choice small { display: block; font-size: .8rem; opacity: .8; }
.key { font-family: var(--f-display); font-size: 1.3rem; line-height: 1; }
.btn { justify-self: start; font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .05em; text-transform: uppercase; color: var(--paper); background: var(--red); border: 0; padding: 9px 18px; cursor: pointer; }
.btn.alt { background: var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.result { display: grid; gap: 10px; padding-top: 12px; border-top: 4px double var(--ink); max-width: 68ch; }
.result:focus { outline: none; }
.pick { font-weight: 700; }
.deltas { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.deltas li { font-size: .82rem; padding: 1px 8px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.good { color: var(--blue); }
.bad { color: var(--red); }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 68ch; }
.docs { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.doc { margin: 0; display: grid; gap: 6px; min-width: 0; }
.doc svg { width: 100%; height: auto; max-width: 440px; display: block; }
.noktm { aspect-ratio: 340 / 214; max-width: 440px; border: 2px dashed var(--ink-soft); display: grid; place-items: center; color: var(--ink-soft); font-weight: 700; padding: 8px; text-align: center; }
.sheet { background: var(--sheet); border-top: 10px solid var(--ink); padding: 8px 10px; overflow-x: auto; display: grid; gap: 4px; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--paper-2); vertical-align: top; }
th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.form { display: grid; gap: 14px; }
.form input { font: inherit; font-weight: 700; color: var(--ink); background: var(--sheet); border: 2px solid var(--ink); padding: 8px 10px; width: min(100%, 22rem); }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.foto { width: 64px; height: 77px; padding: 0; background: var(--paper-2); border: 2px solid var(--ink-soft); cursor: pointer; }
.foto[aria-pressed="true"] { border: 3px solid var(--red); }
.foto svg { width: 100%; height: 100%; display: block; }
.fak { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.slots, .posgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { border: 2px dashed var(--ink-soft); padding: 8px 10px; min-height: 4.2em; display: grid; gap: 2px; align-content: start; }
.slot.full { border-style: solid; border-color: var(--ink); }
.slot .empty { color: var(--ink-soft); }
.slots.dua { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 10px; }
button.slot { font: inherit; color: inherit; background: none; text-align: left; cursor: pointer; }
.slot.aktif { border-color: var(--red); }
.potongan { margin: 0; padding: 10px 14px; border-left: 4px solid var(--ink); background: var(--sheet); font-style: italic; }
.form textarea { font: inherit; color: var(--ink); background: var(--sheet); border: 2px solid var(--ink); padding: 8px 10px; width: 100%; box-sizing: border-box; }
.link { justify-self: start; font: inherit; font-size: .8rem; color: var(--red); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.event { background: var(--ink); color: var(--paper); padding: 12px 14px; display: grid; gap: 6px; }
.event .label { color: var(--paper-2); }
.tuduh summary { cursor: pointer; font-size: .85rem; color: var(--red); }
.tuduh .acts { padding-top: 8px; }
.intro h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: .95; color: var(--red); letter-spacing: .02em; }
.intro { display: grid; gap: 12px; }
.fine { font-size: .84rem; color: var(--ink-soft); }
.end-title { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); line-height: 1; color: var(--red); text-wrap: balance; }
.sejarah { display: grid; gap: 6px; padding: 12px 14px; border: 1px dashed var(--ink-soft); font-size: .9rem; max-width: 68ch; }
.notes { font-size: .86rem; }
.notes summary { cursor: pointer; letter-spacing: .1em; text-transform: uppercase; font-size: .76rem; color: var(--on-desk-soft); }
.notes-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 24px; padding-top: 10px; }
.notes-grid .wide { grid-column: 1 / -1; }
.notes-grid ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
.notes .label { color: var(--on-desk-soft); }
.pips { color: var(--red-hi); letter-spacing: .12em; font-style: normal; }
.panel .pips { color: var(--red); }
@media (max-width: 760px) { .notes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .docs, .fak, .notes-grid { grid-template-columns: minmax(0, 1fr); }
  .slots, .posgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .blink i, .stage.shut .blink i, .kam > svg { transition: none; } .neon, .kam.dorong, .stage .napas, .stage .napas .mata { animation: none; } }
/* laptop dan layar lebar: adegan di kiri, naskah di kanan; halaman pas satu layar, hanya naskah yang bergulir */
@media (min-width: 1000px) and (min-height: 520px) {
  html, body { height: 100%; }
  body { box-sizing: border-box; overflow: hidden; padding-block: 12px; }
  .app { max-width: 1600px; height: 100%; grid-template-columns: minmax(0, 1.6fr) minmax(380px, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .hud { grid-column: 1 / -1; }
  .stage { grid-column: 1; grid-row: 2 / 4; align-self: start; min-width: 0; width: min(100%, calc((100dvh - 150px) * 16 / 9)); }
  .panel { grid-column: 2; grid-row: 2; min-height: 0; overflow-y: auto; overscroll-behavior: contain; align-content: start; }
  .notes { grid-column: 2; grid-row: 3; max-height: 32dvh; overflow-y: auto; }
}
[hidden] { display: none !important; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0 V7" stroke="#1c1916" stroke-width="2.4"/></pattern>
    <pattern id="hatch2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0 V4" stroke="#1c1916" stroke-width="1.6"/></pattern>
    <pattern id="cross" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V9 M0 0 H9" stroke="#1c1916" stroke-width="1.6"/></pattern>
    <pattern id="stub" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.6" fill="#1c1916"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#1c1916"/><circle cx="8" cy="7" r="1" fill="#1c1916"/></pattern>
    <pattern id="batik" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="6" fill="none" stroke="#b0281d" stroke-width="2"/><path d="M0 0 L22 22 M22 0 L0 22" stroke="#1c1916" stroke-width="1.2"/></pattern>
    <pattern id="sarung" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#b0281d"/><rect y="15" width="40" height="10" fill="#1c1916"/><rect x="15" width="10" height="40" fill="#1c1916" opacity=".8"/><path d="M0 5 H40 M0 35 H40 M5 0 V40 M35 0 V40" stroke="#e8e0cb" stroke-width="1.2"/></pattern>
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="9" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch" result="n"/><feColorMatrix in="n" values="0 0 0 0 .11  0 0 0 0 .09  0 0 0 0 .08  -2.4 0 0 0 1.25"/></filter>

<script>
// self-check: setiap tujuan pilihan yang tertulis langsung harus ada
for (const [id, n] of Object.entries(NODES)) {
  console.assert(SCENES[n.scene], 'adegan tidak ada: ' + id);
  for (const k of ['next']) if (n[k]) console.assert(NODES[n[k]], 'tujuan tidak ada: ' + id + ' → ' + n[k]);
  if (Array.isArray(n.choices)) for (const c of n.choices) if (typeof c.go === 'string') console.assert(NODES[c.go], 'tujuan tidak ada: ' + id + ' → ' + c.go);
}
$('scene').addEventListener('click', e => { const h = e.target.closest('.hot'); if (h) act('look', h.dataset.hot); });
$('scene').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('[data-titik]');
  if (t) { e.preventDefault(); act('titik', t.dataset.titik); const f = $('scene').querySelector(`[data-titik="${S.m.rute && S.m.rute.at(-1)}"]`); if (f) f.focus(); return; }
  const h = e.target.closest('.hot'); if (h) { e.preventDefault(); act('look', h.dataset.hot); }
});
// kapur di papan korlap: tekan lalu seret melewati titik-titik peta
let kapur = false;
$('scene').addEventListener('pointerdown', e => { const t = e.target.closest('[data-titik]'); if (!t) return; kapur = true; $('scene').setPointerCapture(e.pointerId); act('titik', t.dataset.titik); });
$('scene').addEventListener('pointermove', e => { if (!kapur) return; const el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest('[data-titik]'); if (t) act('titik', t.dataset.titik); });
for (const ev of ['pointerup', 'pointercancel']) $('scene').addEventListener(ev, () => { kapur = false; });
// klik atau tombol saat naskah sedang muncul: tampilkan semuanya sekaligus
$('panel').addEventListener('click', selesaiUngkap, true);
document.addEventListener('keydown', selesaiUngkap, true);
$('panel').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled || b.type === 'submit' || !b.dataset.a) return;
  act(b.dataset.a, b.dataset.v);
});
// tombol di HUD dan panel catatan (suara, batas waktu) berada di luar panel utama
document.addEventListener('click', e => { const b = e.target.closest('#hud [data-a], #notes-body [data-a]'); if (b && !b.disabled) act(b.dataset.a, b.dataset.v); });
$('panel').addEventListener('input', e => { if (e.target.id === 'ktm-nama') { S.nama = e.target.value; renderScene(); } });
$('panel').addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'ktm-form') act('ambil'); if (e.target.id === 'mg-form') act('mg', $('mg-isi').value); });
S = fresh();
terapkanTeks();
render();
</script>
</body>
